version: '3'
services:
  mail-service:
    image: mail-service
    build:
      context: .
      dockerfile: docker/mail-service/Dockerfile
    ports:
      - 8000:8000
    environment:
      - AWS_ACCESS_KEY_ID=${ETCD_BACKUPS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${ETCD_BACKUPS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - ALLOWED_ORIGINS=http://localhost:8082,http://localhost:8000
      - API_KEY=test
      - TO_EMAIL=${TO_EMAIL}
      - DOMAIN=${DOMAIN}
    depends_on:
      - redis
  redis:
    image: redis:latest
    ports:
      - 6379:6379